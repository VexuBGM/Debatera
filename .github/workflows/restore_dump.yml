- name: Verify DB connection
  run: |
    docker run --rm postgres:17 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select now(), current_database();"

- name: Backup current DB (artifact)
  run: |
    docker run --rm \
      -v "${{ github.workspace }}:/work" -w /work \
      postgres:17 pg_dump "$DATABASE_URL" -Fc -f pre_restore_backup.dump

- name: Upload backup artifact
  uses: actions/upload-artifact@v4
  with:
    name: pre-restore-backup
    path: pre_restore_backup.dump

- name: TRUNCATE all tables (keep _prisma_migrations)
  run: |
    docker run --rm postgres:17 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
    DO $$
    DECLARE r RECORD;
    BEGIN
      FOR r IN (
        SELECT tablename
        FROM pg_tables
        WHERE schemaname = 'public'
          AND tablename <> '_prisma_migrations'
      ) LOOP
        EXECUTE format('TRUNCATE TABLE public.%I CASCADE;', r.tablename);
      END LOOP;
    END $$;
    SQL

- name: Restore DATA ONLY from dump
  run: |
    docker run --rm \
      -v "${{ github.workspace }}:/work" -w /work \
      postgres:17 pg_restore \
        --no-owner --no-privileges \
        --data-only \
        -T "_prisma_migrations" \
        --dbname "$DATABASE_URL" \
        --verbose \
        ops/debatera_backup.dump