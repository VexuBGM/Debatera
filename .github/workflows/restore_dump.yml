name: Restore DB from dump (one-time)

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm dump file exists
        run: |
          ls -lh ops/debatera_backup.dump

      - name: Verify DB connection (Postgres 18 client)
        run: |
          docker run --rm postgres:18 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select now(), current_database();"

      - name: Show target host + db (safe)
        run: |
          python - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlparse(os.environ["DATABASE_URL"])
          print("HOST:", u.hostname)
          print("DB:", u.path.lstrip("/"))
          PY

      - name: Backup current DB (Postgres 18 client)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            postgres:18 pg_dump "$DATABASE_URL" -Fc -f pre_restore_backup.dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-restore-backup
          path: pre_restore_backup.dump

      - name: TRUNCATE all tables (keep _prisma_migrations)
        run: |
          cat <<'SQL' | docker run --rm -i postgres:18 psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          DO $$
          DECLARE r RECORD;
          BEGIN
            FOR r IN (
              SELECT tablename
              FROM pg_tables
              WHERE schemaname = 'public'
                AND tablename <> '_prisma_migrations'
            ) LOOP
              EXECUTE format('TRUNCATE TABLE public.%I CASCADE;', r.tablename);
            END LOOP;
          END $$;
          SQL

      - name: Restore DATA ONLY from dump (does not create tables)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            postgres:18 pg_restore \
              --exit-on-error \
              --no-owner --no-privileges \
              --data-only \
              -T "_prisma_migrations" \
              --dbname "$DATABASE_URL" \
              --verbose \
              ops/debatera_backup.dump

      - name: Post-restore sanity check (counts)
        run: |
          cat <<'SQL' | docker run --rm -i postgres:18 psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          SELECT COUNT(*) AS tournaments FROM "Tournament";
          SELECT COUNT(*) AS ballots FROM "Ballot";
          SELECT COUNT(*) AS ballot_speeches FROM "BallotSpeech";
          SELECT id, name FROM "Tournament" ORDER BY "createdAt" DESC LIMIT 5;
          SQL